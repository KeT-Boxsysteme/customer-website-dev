<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sensor Diagnostics</title>
  <!-- Temporaeres Messwerkzeug (Vault: Offene Punkte, Bluetooth-Fuehler). Sendet NUR den Lesebefehl B7
       (Online-Messwert) aus public/js/bluedan.js. Vor dem naechsten main-Merge entfernen oder hinter Login legen. -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f4f6fa; color: #1c2430; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    button { font-size: 1rem; padding: 12px 16px; border: 0; border-radius: 8px; background: #2f5d9e; color: #fff; }
    button:disabled { background: #9aa7b8; }
    input { font-size: 1rem; padding: 10px; width: 5em; border: 1px solid #c3ccd8; border-radius: 8px; }
    #status { font-weight: 600; margin-bottom: 8px; }
    #latest { font-size: 2.6rem; font-weight: 700; margin: 8px 0 4px; }
    #age { color: #5b6778; margin-bottom: 16px; }
    #log { font-family: ui-monospace, monospace; font-size: .85rem; background: #fff; border-radius: 8px;
           padding: 8px; max-height: 55vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
    .entry { border-bottom: 1px solid #e3e7ee; padding: 4px 0; }
  </style>
</head>
<body>
  <h1>Temperature sensor diagnostics</h1>
  <div id="status">Not connected</div>
  <div id="latest">–</div>
  <div id="age">No live value yet</div>
  <div class="row">
    <button id="connectBtn">Connect sensor</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <label for="interval">Every</label>
    <input id="interval" type="number" min="1" max="3600" value="5"> <span>seconds</span>
  </div>
  <div id="log"></div>

  <script src="/js/bluedan.js"></script>
  <script>
    const B = window.BlueDAN;
    let device = null, rx = null, tx = null, serial = null, timer = null, lastAt = null, count = 0;
    const $ = id => document.getElementById(id);
    const hex = bytes => [...bytes].map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    const text = bytes => [...bytes].map(b => b === 0xF8 ? '°' : b === 9 ? ' ' : b === 10 ? '' : String.fromCharCode(b)).join('');

    function info(msg) {
      const div = document.createElement('div');
      div.className = 'entry';
      div.textContent = `${new Date().toLocaleTimeString()} ${msg}`;
      $('log').prepend(div);
    }

    function onValue(e) {
      const v = e.target.value;
      const bytes = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
      const temp = B.parseOnlineValue(bytes);
      count++;
      if (temp !== null) {
        $('latest').textContent = temp.toFixed(1) + ' °C';
        lastAt = Date.now();
      }
      info(`#${count} ${text(bytes)}   (HEX ${hex(bytes)})${temp === null ? '  – not a temperature' : ''}`);
    }

    async function request() {
      try { await tx.writeValueWithResponse(B.buildOnlineRequest(serial)); }
      catch (err) { info('Request failed: ' + err.message); }
    }

    function restartTimer() {
      if (timer) clearInterval(timer);
      const sec = Math.min(3600, Math.max(1, parseInt($('interval').value, 10) || 5));
      timer = setInterval(request, sec * 1000);
      request();
    }

    async function connect() {
      if (!navigator.bluetooth) {
        $('status').textContent = 'Web Bluetooth is not available in this browser (use Chrome or Edge).';
        return;
      }
      try {
        device = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'BD ' }], optionalServices: [B.SERVICE]
        });
        serial = B.serialFromName(device.name);
        if (!serial) { $('status').textContent = 'Unknown sensor name: ' + device.name; return; }
        device.addEventListener('gattserverdisconnected', () => {
          $('status').textContent = 'Disconnected';
          info('Sensor disconnected');
          if (timer) clearInterval(timer);
          $('disconnectBtn').disabled = true;
        });
        $('status').textContent = 'Connecting to ' + device.name + ' …';
        const service = await (await device.gatt.connect()).getPrimaryService(B.SERVICE);
        rx = await service.getCharacteristic(B.RX_CHAR);
        tx = await service.getCharacteristic(B.TX_CHAR);
        rx.addEventListener('characteristicvaluechanged', onValue);
        await rx.startNotifications();
        $('status').textContent = 'Connected: ' + device.name + ' (serial ' + serial + ')';
        $('disconnectBtn').disabled = false;
        info('Connected – requesting live value (command B7)');
        restartTimer();
      } catch (err) {
        $('status').textContent = 'Error: ' + err.message;
        info('Error: ' + err.name + ' – ' + err.message);
      }
    }

    setInterval(() => {
      if (lastAt) $('age').textContent = 'Last live value ' + Math.round((Date.now() - lastAt) / 1000) + ' s ago';
    }, 1000);

    $('connectBtn').addEventListener('click', connect);
    $('disconnectBtn').addEventListener('click', () => device && device.gatt.disconnect());
    $('interval').addEventListener('change', () => { if (tx) restartTimer(); });
  </script>
</body>
</html>
